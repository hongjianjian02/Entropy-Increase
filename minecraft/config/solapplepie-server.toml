# 累计进食 30 次后才启用奖励（次数，不是 30 种食物）。
minFoodsToActivate = 30
[Filtering]
# 空酒瓶不计入多样性；妖怪归家使用本版 youkaishomecoming 命名空间。
blacklist = ["youkaishomecoming:sake_bottle"]

# 留空，所有未被黑名单排除的可食物品均可参与。
whitelist = []

[Miscellaneous]
# 死亡不重置多样性。
resetOnDeath = false

# 沿用参考配置，非生存模式也可记录。
limitProgressionToSurvival = false

# 从吃过的不同食物中，按当前复杂度保留最高的 8 种计分。
queueSize = 8

# 自定义苹果派版新增模式：低分食物不挤掉高分记录，重复食物不重复加分。
# 内部保留吃过的食物历史，方便将来调整复杂度后重新选取最高 8 种。
keepHighestDiversityFoods = true

[Advanced]
# 最高多样性模式忽略时间衰减；下列衰减值用于关闭该模式后的普通记录。
minContribution = 1.0

# 未单独设置复杂度的食物按营养和饱和度公式计算，此值是基础倍率。
defaultContribution = 1.0

# 普通模式的衰减终点；最高多样性模式下忽略。
endDecay = 8

# 普通模式的衰减起点；最高多样性模式下忽略。
startDecay = 8

# 黑名单食物不占用进食队列。
shouldForbiddenCount = false

